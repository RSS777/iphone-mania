name: Garimpo de iPhones

on:
  schedule:
    - cron: "*/20 * * * *" # OLX, toda rodada
    - cron: "0 */3 * * *"  # Facebook Marketplace, só a cada 3h — sessão dele
                            # cai com frequência quando usada demais de IPs
                            # trocando toda hora (padrão de sequestro de sessão
                            # aos olhos do Facebook); rodar menos reduz o risco.
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: ./scraper
      - run: scrapling install
        working-directory: ./scraper
      - run: python main.py
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FACEBOOK_COOKIES_JSON: ${{ secrets.FACEBOOK_COOKIES_JSON }}
          INCLUIR_FACEBOOK: ${{ github.event_name != 'schedule' || github.event.schedule == '0 */3 * * *' }}
